name: Scrape

on:
  schedule:
    - cron: "0 13 * * *" # 8 a.m. Eastern every day
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install pipenv
      run: pipx install pipenv
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pipenv'
   
    - run: pipenv install --python `which python`
    
    - name: Install importlib-metadata
      run: pipenv install importlib-metadata

    - name: Install Jupyter Notebook
      run: pip install jupyter
    
    - name: Run scraper
      run: pipenv run jupyter execute scraper.ipynb
    
    - name: Add and commit	
      run: |
        git add .	
        git config user.name "Automated"	
        git config user.email "actions@users.noreply.github.com"	
        git commit -m "Latest data" 	
    
    - name: Push	
      run: git push
